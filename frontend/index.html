<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Auth RBAC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Login Screen -->
    <div id="login-screen" class="w-full max-w-md bg-gray-900 p-8 rounded-2xl shadow-2xl border border-gray-800 transition-all duration-500">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-purple-400 mb-2">Secure Auth RBAC</h1>
            <p class="text-gray-400">Employer & Investor Demo Access</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Demo Email</label>
                <input type="email" id="email" value="admin@demo.com" readonly class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white outline-none focus:border-purple-500 cursor-not-allowed">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Demo Password</label>
                <input type="password" id="password" value="password123" readonly class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white outline-none focus:border-purple-500 cursor-not-allowed">
            </div>
            
            <button onclick="handleLogin()" class="w-full mt-6 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center">
                <span id="btn-text">Sign In Securely</span>
                <svg id="spinner" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
            <p class="text-xs text-center text-gray-500 mt-4">Credentials are pre-filled for demo purposes.</p>
        </div>
    </div>

    <!-- Main Dashboard (Hidden initially) -->
    <div id="dashboard-screen" class="w-full max-w-6xl mx-auto hidden opacity-0 transition-opacity duration-700">
        <nav class="flex justify-between items-center py-4 mb-8 border-b border-gray-800">
            <h1 class="text-2xl font-black text-purple-400">Secure Auth RBAC</h1>
            <div class="flex items-center space-x-4">
                <span class="text-gray-400 text-sm">admin@demo.com</span>
                <button onclick="handleLogout()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm font-medium transition-colors">Logout</button>
            </div>
        </nav>
        
        <!-- Dashboard Content -->
        
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 mb-6">
                <h3 class="text-xl font-bold mb-2 text-purple-400">Welcome, Admin User</h3>
                <p class="text-gray-400">Role: <span class="px-2 py-1 bg-purple-900 text-purple-300 rounded text-xs">SUPER_ADMIN</span></p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h3 class="text-lg font-bold mb-4 text-white">User Management</h3>
                <table class="w-full text-left">
                    <thead class="text-gray-400 border-b border-gray-700"><tr><th class="pb-2">Email</th><th class="pb-2">Role</th><th class="pb-2">Actions</th></tr></thead>
                    <tbody class="text-white">
                        <tr><td class="py-3">investor@demo.com</td><td><span class="text-blue-400">USER</span></td><td><button class="text-xs bg-gray-700 px-2 py-1 rounded hover:bg-gray-600">Edit Role</button></td></tr>
                        <tr><td class="py-3 border-t border-gray-700">moderator@site.com</td><td class="border-t border-gray-700"><span class="text-yellow-400">MODERATOR</span></td><td class="border-t border-gray-700"><button class="text-xs bg-gray-700 px-2 py-1 rounded hover:bg-gray-600">Edit Role</button></td></tr>
                    </tbody>
                </table>
            </div>
        
    </div>

    <script>
        function handleLogin() {
            document.getElementById('btn-text').innerText = 'Authenticating...';
            document.getElementById('spinner').classList.remove('hidden');
            
            // Simulate network request
            setTimeout(() => {
                document.getElementById('login-screen').classList.add('hidden');
                const dashboard = document.getElementById('dashboard-screen');
                document.body.classList.remove('items-center', 'justify-center');
                document.body.classList.add('items-start');
                dashboard.classList.remove('hidden');
                
                // Trigger reflow to apply opacity transition
                void dashboard.offsetWidth; 
                dashboard.classList.remove('opacity-0');
            }, 1200);
        }

        function handleLogout() {
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.add('opacity-0');
            document.body.classList.remove('items-start');
            document.body.classList.add('items-center', 'justify-center');
            
            document.getElementById('btn-text').innerText = 'Sign In Securely';
            document.getElementById('spinner').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
